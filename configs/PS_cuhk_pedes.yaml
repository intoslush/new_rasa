train_file:  ['./re_id/CUHK-PEDES/processed_data/train.json']
val_file: './re_id/CUHK-PEDES/processed_data/val.json'
test_file: './re_id/CUHK-PEDES/processed_data/test.json'
train_image_root: './re_id/CUHK-PEDES/imgs'
val_image_root: './re_id/CUHK-PEDES/imgs'
test_image_root: './re_id/CUHK-PEDES/imgs'

bert_config: 'configs/config_bert.json'

max_words: 50
image_res: 384
batch_size_train: 16
batch_size_test: 64

mlm_probability: 0.15
weak_pos_pair_probability: 0.1
mrtd_mask_probability: 0.3
queue_size: 65536
momentum: 0.995
vision_width: 768
embed_dim: 256
temp: 0.07
k_test: 128

alpha: 0.4
warm_up: True

optimizer: {opt: adamW, lr: 1e-5, weight_decay: 0.02, lr_custm: 1e-4}
schedular: {sched: cosine, lr: 1e-5, epochs: 35, min_lr: 2e-6, decay_rate: 1, warmup_lr: 1e-5, warmup_epochs: 1, cooldown_epochs: 0}

eval_epoch: 0


weights: {"loss_cl": 0.5, "loss_itm": 1, "loss_mlm": 1, "loss_prd": 0.5, "loss_mrtd": 0.5,"loss_sim": 0.5, "loss_itm_softmask": 1}
# 新增的权重调度配置
weights_schedule:
  freeze_epochs: 40     # 前 20 个 epoch 不变
  mode: "cosine"        # 可改为 "cosine" 获得更平滑的变化linear
  normalize_sum: false  # 若希望总权重和保持不变可改为 true
  loss_cl:
    min: 0            # 20 之后从 0.5 线性降到 0.1（到最后一个 epoch 达到）
  loss_mlm:
    max: 1.5 
  loss_itm:
    min: 0.2 
    max: 1.5

use_momentum_queue: True #是否使用动量
use_queue: True #是否使用队列
reset_queue_each_epoch: True  #每个epoch是否重置队列
enable_cl_loss: True
itm_neg_sampling  : 'cl' # 一个参数决定采样方式：'cl' or 'random'，如果关cl需要改为random

enable_mlm_loss:  True
saliency_compute_epoch: 10 #计算saliency的epoch
debug_mask_epoch: 10  #用来输出可视化的mask词的epoch
mlm_soft_label: False
debug_log_saliency: False  #用来输出可视化的mask词

cluster_feature_mode : "image"
cluster_fusion_use_proj : False   # 保持“融合 CLS 原始特征”
# cluster_text_key : "caption1"     # 也可改 caption1
cluster_min_samples : 4
cluster_eps : 0.6


enable_itm_loss: True
# =========================
# ITC（图文对比学习）+ teacher(动量) ITM 亲和度融合
# =========================

# 是否把 teacher(动量) ITM 生成的“跨样本匹配亲和度”融合进 ITC 的 soft targets。
# - true：ITC targets = (1-beta)*base_targets + beta*P_itm_affinity（按行归一化）
# - false：退化为 base_targets（pseudo_label 的硬正样本 + 可选的动量 CL 蒸馏）
itc_use_itm_affinity: true

# 对每个 image，在当前 batch 内先用动量 CL 相似度筛选 top-k 个候选文本，
# 只对这些候选做 teacher fusion + ITM 推理，得到稀疏亲和度矩阵 P(i, t_j)。
# 这是“额外计算量”的主要开关：
# - k 越大：覆盖的候选越多、挖掘能力更强，但更慢、也可能更噪
# - k 越小：更快、更保守、更稳定，但挖掘能力下降
# 注意：实际会被 batch size 截断：k = min(itc_itm_topk, B)
itc_itm_topk: 8

# ITC targets 中融合 ITM 亲和度 P 的权重 beta。
# - 0.0：完全不用 ITM affinity（等价于关闭 itc_use_itm_affinity）
# - 1.0：几乎完全相信 teacher ITM affinity（通常过激进，易不稳）
# 常用稳定范围：0.1 ~ 0.5
itc_itm_beta: 0.2

# ITC 的“正样本 gating”阈值：用 teacher 对正配对 (i, t_i) 的匹配概率 p_m(i,t_i)
# 生成样本权重 w_pos，对每个样本的 ITC loss 做加权平均以降低噪声影响。
# 公式：w_pos = clamp((p - tau_low) / (tau_high - tau_low), 0, 1)
# 直觉：
# - p < tau_low：认为该正配对不可靠，权重接近 0（几乎不给梯度）
# - p > tau_high：认为可靠，权重为 1（正常训练）
# 调参建议：
# - 如果发现大部分 w_pos 接近 0：阈值太严（可降到 0.2/0.6）
# - 如果训练不稳定/噪声大：阈值可更严（如 0.4/0.8）
itc_itm_gate_tau_low: 0.5
itc_itm_gate_tau_high: 0.8


# =========================
# ITM（图文匹配二分类）蒸馏 + 假负样本降权
# =========================

# 是否启用 ITM 蒸馏与“假负样本”降权：
# - true：teacher(动量) ITM 的概率作为 soft label，同时对 teacher 认为可能为真的负样本降低权重
# - false：退化为纯硬标签交叉熵（原始实现）
itm_use_distill: true

# ITM 的 hard CE 与 teacher soft CE 的混合系数 lambda。
# loss = (1 - lambda)*hard_ce + lambda*soft_ce
# - 0.0：纯硬标签
# - 1.0：纯模仿 teacher（如果 teacher 早期较弱，可能导致“自证循环”）
# 常用范围：0.3 ~ 0.7
itm_distill_lambda: 0.3

# ITM 的“假负样本降权”阈值 tau：针对负样本对 (i, t_neg) / (i_neg, t)
# teacher 给出 match 概率 p_neg：
# - p_neg <= tau：认为是正常负样本，权重约为 1
# - p_neg -> 1：认为可能是假负（其实是匹配），权重逐渐降到 0
# tau 越低：越激进地过滤/降权负样本（更稳但可能放过 hard negatives）
# tau 越高：越保守（只有 teacher 很确信时才降权）
# 常用范围：0.5 ~ 0.8
itm_neg_filter_tau: 0.8

# ITM 的“正样本 gating”阈值：同 ITC 一样，用 teacher 对正配对 (i, t_i) 的匹配概率
# 生成 w_pos，对 ITM 的正样本损失进行降噪加权。
# 公式：w_pos = clamp((p - tau_low) / (tau_high - tau_low), 0, 1)
itm_gate_tau_low: 0.5
itm_gate_tau_high: 0.8


